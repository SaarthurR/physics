<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Physics 7C Study Guides</title>
    <meta
      name="description"
      content="Physics 7C study guides for Quiz 1, Quiz 2, and Quiz 2.2 with clean document navigation."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="topbar-copy">
          <p class="eyebrow" id="guide-eyebrow">Physics 7C</p>
          <h1 id="guide-title">Study Guides</h1>
        </div>
        <div class="topbar-actions">
          <div class="guide-tabs" role="tablist" aria-label="Quiz study guides">
            <button
              class="guide-tab is-active"
              id="guide-tab-quiz1"
              type="button"
              data-guide-tab="quiz1"
              role="tab"
              aria-selected="true"
            >
              Quiz 1
            </button>
            <button
              class="guide-tab"
              id="guide-tab-quiz2"
              type="button"
              data-guide-tab="quiz2"
              role="tab"
              aria-selected="false"
            >
              Quiz 2
            </button>
            <button
              class="guide-tab"
              id="guide-tab-quiz22"
              type="button"
              data-guide-tab="quiz22"
              role="tab"
              aria-selected="false"
            >
              Quiz 2.2
            </button>
          </div>
        </div>
      </header>

      <section class="workspace" id="workspace">
        <aside class="doc-sidebar" id="doc-sidebar">
          <div class="sidebar-head">
            <p class="sidebar-label" id="sidebar-label">Bookmarks</p>
            <button
              class="sidebar-collapse"
              id="sidebar-collapse"
              type="button"
              aria-expanded="true"
              aria-label="Collapse document tabs"
            >
              ‹
            </button>
          </div>

          <nav class="outline-nav" id="outline-nav" aria-label="Study guide outline"></nav>
        </aside>

        <main class="doc-main">
          <article class="doc-paper">
            <header class="doc-paper-head">
              <div class="doc-paper-head-top">
                <div>
                  <p class="section-label" id="doc-guide-label">Quiz 1</p>
                  <h2 id="doc-guide-heading">Waves foundations and worked examples</h2>
                </div>
              </div>
              <p id="doc-guide-summary">
                Jump from the left-side bookmarks into a single clean reading sheet.
              </p>
              <div class="formula-strip formula-strip-inline" id="formula-strip"></div>
            </header>

            <section id="document-root"></section>
          </article>
        </main>
      </section>
    </div>

    <div class="floating-actions-rail">
      <button
        class="notes-fab"
        id="notes-button"
        type="button"
        aria-expanded="false"
        aria-controls="notes-shell"
        aria-label="Open notes"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path
            d="M6 3H15.5L20 7.5V19C20 20.1 19.1 21 18 21H6C4.9 21 4 20.1 4 19V5C4 3.9 4.9 3 6 3ZM15 4.5V8H18.5L15 4.5ZM8 11H16V12.5H8V11ZM8 14H16V15.5H8V14ZM8 17H13V18.5H8V17Z"
            fill="currentColor"
          />
        </svg>
      </button>

      <button
        class="study-concepts-fab"
        id="study-concepts-button"
        type="button"
        aria-expanded="false"
        aria-controls="study-concepts-shell"
        aria-label="Open study concepts"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path
            d="M7 3H17C18.1 3 19 3.9 19 5V19C19 20.1 18.1 21 17 21H7C5.9 21 5 20.1 5 19V5C5 3.9 5.9 3 7 3ZM8 7V9H16V7H8ZM8 11V13H16V11H8ZM8 15V17H13V15H8Z"
            fill="currentColor"
          />
        </svg>
        <span class="study-concepts-count" id="study-concepts-count">0</span>
      </button>

    </div>

    <div class="selection-actions" id="selection-actions" aria-hidden="true">
      <button
        class="selection-action selection-action-secondary"
        id="selection-study-action"
        type="button"
        aria-label="Save selected text to study later"
        data-tooltip="Save to study later"
      >
        +
      </button>

      <button
        class="selection-action selection-action-highlight"
        id="selection-highlight-action"
        type="button"
        aria-label="Highlight selected text"
        data-tooltip="Highlight in document"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path
            d="M15.9 3.8L20.2 8.1L11.1 17.2L6.2 17.8L6.8 12.9L15.9 3.8ZM5.6 18.6L9.7 18.1L5.1 22.7L1.3 18.9L5.6 18.6Z"
            fill="currentColor"
          />
        </svg>
      </button>
    </div>

    <aside class="study-concepts-shell" id="study-concepts-shell" aria-hidden="true">
      <div class="study-concepts-header">
        <div>
          <p class="chat-kicker">Study later</p>
          <h2>Study concepts</h2>
        </div>
        <button class="chat-close" id="study-concepts-close" type="button" aria-label="Close study concepts">
          ×
        </button>
      </div>
      <div class="study-concepts-root" id="study-later-root"></div>
    </aside>

    <aside class="notes-shell" id="notes-shell" aria-hidden="true">
      <div class="notes-header">
        <div>
          <p class="chat-kicker">Reading notes</p>
          <h2>Notepad</h2>
        </div>
        <button class="chat-close" id="notes-close" type="button" aria-label="Close notes">
          ×
        </button>
      </div>
      <div class="notes-body">
        <label class="notes-label" for="notes-input">Notes</label>
        <textarea
          id="notes-input"
          class="notes-input"
          rows="12"
          placeholder="Type notes as you read. They save automatically in this browser."
        ></textarea>
        <div class="notes-saved">
          <div class="notes-saved-head">
            <div>
              <p class="quiz-kicker">Saved highlights</p>
              <h4 class="quiz-title">Marked passages</h4>
            </div>
          </div>
          <div class="notes-highlights-root" id="notes-highlights-root"></div>
        </div>
      </div>
    </aside>

    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    ></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
