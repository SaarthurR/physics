                  - generic [ref=e595]:
                    - paragraph [ref=e596]: You're at a stadium. The crowd does a "wave" - people raise their arms section by section. The individuals don't travel; they just move up and down. But something - the disturbance - travels all the way around the stadium.
                    - paragraph [ref=e597]: "For the mechanical waves we start with, that's a wave in one sentence: a disturbance that moves through a medium, carrying energy, without actually transporting the medium itself."
                    - paragraph [ref=e598]: Think about it - when an ocean wave passes under a boat, the boat bobs up and down. But the water under the boat isn't flowing to shore. The energy travels; the water stays roughly in place.
                - article [ref=e599]:
                  - generic [ref=e600]:
