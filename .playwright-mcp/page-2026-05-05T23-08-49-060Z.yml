                      - paragraph [ref=e782]:
                        - strong [ref=e783]: "Problem:"
                        - text: You are in a small boat anchored in a harbor. Ocean waves are moving past you such that a wave crest passes by every six seconds. You observe that these crests are spaced 20 m apart. You also notice that a buoy anchored 10 m to the right of you is also bobbing along with the waves.
                      - list [ref=e784]:
                        - listitem [ref=e785]: Exactly what is moving as the waves propagate?
                        - listitem [ref=e786]: What is the speed of the wave?
                        - listitem [ref=e787]: When your boat is at a wave peak, you notice that it is 0.5 m above the buoy. A few seconds later when your boat is at a trough, it is 0.5 m lower than the buoy. What is the amplitude of this wave? Will the buoy and your boat ever be at the same height? (Draw a physical picture of the boat and buoy and label relevant distances.)
                        - listitem [ref=e788]: Write an equation to describe this wave, assuming the wave moves to the left, your boat is at position x = 0, and that at time t = 0, your boat is on a crest. Explain all values.
                        - listitem [ref=e789]: Using your answer in 3), write an equation to describe the motion of the buoy. On your board, graph the buoy’s motion as a function of time, being sure to show at least two full periods.
                        - listitem [ref=e790]: What is the displacement from equilibrium at x = 5 m and t = 2 s?
                    - generic [ref=e791]:
                      - heading "1 - What is actually moving?" [level=4] [ref=e792]
                      - paragraph [ref=e793]: The water mostly oscillates around equilibrium. The thing that propagates from place to place is the disturbance and the energy it carries, not a chunk of water sailing across the harbor.
                      - heading "2 - Wave speed" [level=4] [ref=e794]
                      - button "v = λ / T = 20 m / 6 s ≈ 3.33 m/s" [ref=e795]
                      - heading "3 - Amplitude and boat/buoy relationship" [level=4] [ref=e796]
                      - paragraph [ref=e797]: The boat is 0.5 m above the buoy at one instant and 0.5 m below a little later, so each object sits 0.5 m from equilibrium at its extreme position.
                      - button "A = 0.5 m" [ref=e798]
                      - paragraph [ref=e799]: "The boat and buoy are separated by 10 m, which is λ/2. That means they are always out of phase by π: when one is at a crest the other is at a trough, and they pass through equilibrium at the same height twice per cycle."
                      - heading "4 - Wave equation" [level=4] [ref=e800]
                      - paragraph [ref=e801]: The original DL1 prompt explicitly says to assume the wave moves to the left, so the sign on the x-term is plus. At x = 0 and t = 0 the boat is on a crest, so sin(φ₀) = 1 and φ₀ = π/2.
                      - button "y(x, t) = 0.5 sin(2πt/6 + 2πx/20 + π/2) meters" [ref=e802]
