                    - paragraph [ref=e1016]: Imagine the ambulance emitting crests at regular intervals. When the ambulance moves toward you, each successive crest is emitted from a position slightly closer to you than the last. So the crests are squeezed together - shorter wavelength - which means higher frequency for you.
                    - paragraph [ref=e1017]: When the ambulance moves away, each crest is emitted from farther away. The crests are stretched out - longer wavelength - lower frequency.
