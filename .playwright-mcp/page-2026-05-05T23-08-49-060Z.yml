                  - paragraph [ref=e669]: Every wave has a fingerprint - a set of numbers that describe exactly how it moves. The wave equation is how we write that fingerprint mathematically. Once you understand what each piece means, you can read a wave like reading a sentence.
                - article [ref=e670]:
                  - generic [ref=e671]:
