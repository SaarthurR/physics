                  - generic [ref=e2107]:
                    - paragraph [ref=e2108]: "The LibreTexts section starts from the physical picture underneath the formulas: a wave exists because a medium can be displaced, and once one part is displaced, restoring forces push and pull neighboring parts so the disturbance keeps getting handed forward."
                    - paragraph [ref=e2109]: That is why a wave can move energy through the medium without the medium itself being carried away with it. The particles only wobble around equilibrium; the disturbance is what travels.
                    - paragraph [ref=e2110]:
                      - text: A
