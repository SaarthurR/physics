                  - generic [ref=e684]:
                    - heading "A - Amplitude" [level=4] [ref=e685]
                    - paragraph [ref=e686]: The maximum displacement from equilibrium. How "tall" the wave is.
                    - paragraph [ref=e687]:
                      - strong [ref=e688]: "Real life:"
                      - text: Turn up the volume on a speaker - you're increasing the amplitude of the sound wave. The wave gets "bigger" but not faster.
                    - paragraph [ref=e689]:
                      - strong [ref=e690]: Source or medium?
                      - text: In the simple model it is mainly source-set. You usually control it by how hard you shake the source, though real transmitted amplitude can also depend on the setup.
                    - heading "T - Period" [level=4] [ref=e691]
                    - paragraph [ref=e692]: "Time for one complete oscillation (one full cycle). Units: seconds."
                    - paragraph [ref=e693]:
                      - strong [ref=e694]: "Real life:"
                      - text: The period of a clock's pendulum is about 2 seconds (tick...tock = one cycle).
                    - paragraph [ref=e695]:
                      - strong [ref=e696]: Source or medium?
                      - text: Source-dependent. Set by whatever is generating the wave.
                    - heading "f - Frequency" [level=4] [ref=e697]
                    - paragraph [ref=e698]: How many cycles per second. The reciprocal of period.
                    - 'button "f = 1/T Units: Hz (Hertz = cycles per second)" [ref=e699]'
                    - paragraph [ref=e700]: Period and frequency are opposites. High frequency = short period. Low frequency = long period. A 440 Hz musical note (concert A) has a period of about 0.0023 seconds - tiny!
                    - heading "λ - Wavelength" [level=4] [ref=e701]
                    - paragraph [ref=e702]: The spatial analogue of period. The distance the wave travels in one full cycle. It's the distance between two consecutive crests (or troughs, or any equivalent points).
                    - paragraph [ref=e703]:
                      - strong [ref=e704]: Medium or source?
                      - text: Both. It depends on wave speed (medium) AND frequency (source). See the relationship below.
                    - heading "v - Wave Speed" [level=4] [ref=e705]
                    - paragraph [ref=e706]: How fast the disturbance moves through the medium. NOT the same as how fast the medium's particles move.
                    - button "v = λ / T = λf" [ref=e707]
                    - paragraph [ref=e708]:
                      - strong [ref=e709]: "Medium-dependent:"
                      - text: Change the tension on a string → change the wave speed. The source doesn't control this.
                    - paragraph [ref=e710]:
                      - strong [ref=e711]: "Key insight:"
                      - text: Same source, different medium → same frequency, different speed → different wavelength.
                    - heading "Φ - Total Phase" [level=4] [ref=e712]
                    - paragraph [ref=e713]: "The argument of the sine function. It tells you exactly where in the oscillation cycle the wave is at any given (x, t). Units: radians."
                    - button "Φ = 2πt/T ± 2πx/λ + φ₀" [ref=e714]
                    - paragraph [ref=e715]: If Φ increases by 2π, you complete one full cycle and return to the same state. That's it.
                    - heading "φ₀ - Fixed Phase Constant" [level=4] [ref=e716]:
                      - text: φ₀ - Fixed
                      - button "Phase Constant" [ref=e717] [cursor=pointer]
                    - paragraph [ref=e718]: The "starting phase" - where the wave is in its cycle at t = 0, x = 0. It is fixed by the initial conditions together with your chosen origin for position and time.
