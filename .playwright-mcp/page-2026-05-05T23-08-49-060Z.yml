                      - paragraph [ref=e1268]:
                        - strong [ref=e1269]: "Problem:"
                        - text: Three people (An, Bob, and Carla) are in a very still pond. Bob generates waves by moving up and down in the water. The speed of water waves in this pond is 3 m/s.
                      - 'figure "The DL3 figure gives the actual geometry: Bob-An is 4 m, Bob-Carla is 2 m, and An-Carla is 3 m." [ref=e1270]':
                        - img "Pond problem diagram with An, Bob, and Carla distances" [ref=e1271]
                        - generic [ref=e1272]: "The DL3 figure gives the actual geometry: Bob-An is 4 m, Bob-Carla is 2 m, and An-Carla is 3 m."
                      - list [ref=e1273]:
                        - listitem [ref=e1274]:
                          - text: Suppose it takes Bob 4/3 seconds to travel through a cycle. Determine the wavelength of the resulting waves and use the
                          - button "wavefront" [ref=e1275] [cursor=pointer]
                          - text: representation to draw in the wave crests and troughs generated by Bob on your board. Label the wavelength on your sketch.
                        - listitem [ref=e1276]: Compare the motion of An and Carla, due to waves generated by Bob. Be as detailed as possible. (i.e. Do they move up and down at the same rate? Are they both at a crest at the same time?)
                        - listitem [ref=e1277]:
                          - text: The group allows the water to become calm, and then An and Carla move up and down with the same frequency as each other (different from Bob’s in parts 1 and 2), starting their motion at the same instant at the same point in the cycle. They wish to team up so that, after they have been bobbing for a while, a wave crest from each person always arrives at Bob at the same time. With what frequency should they move? (Note that more than one correct answer is possible, your group only needs to find one possibility!) What type of
                          - button "interference" [ref=e1278] [cursor=pointer]
                          - text: is Bob experiencing?
                        - listitem [ref=e1279]:
                          - text: Use the
                          - button "wavefront" [ref=e1280] [cursor=pointer]
                          - text: representation to draw in the wave crests and troughs generated by An and by Carla. Do this on a different sketch than you used for questions 1) and 2).
                        - listitem [ref=e1281]: Describe Bob’s motion in a sentence or two (no equation necessary). How does his motion differ from how it would be if only Carla were making waves?
                    - generic [ref=e1282]:
                      - heading "1 - Bob as the source" [level=4] [ref=e1283]
                      - button "λ = vT = 3 × (4/3) = 4 m" [ref=e1284]
                      - paragraph [ref=e1285]: So Bob's crests are 4 m apart, and troughs sit halfway between successive crests.
                      - heading "2 - An and Carla responding to Bob" [level=4] [ref=e1286]
                      - paragraph [ref=e1287]: Both observers move with the same frequency as Bob's wave because they are being driven by the same source. But they are not in the same phase, because Bob-An and Bob-Carla are different distances.
                      - button "Δx = |4 - 2| = 2 m = λ/2" [ref=e1288]
                      - paragraph [ref=e1289]: "That means An and Carla are out of phase by π for Bob's original wave: when one is near a crest, the other is near a trough."
                      - heading "3 - An and Carla as the sources" [level=4] [ref=e1290]
                      - paragraph [ref=e1291]:
                        - text: For Bob to receive crests from An and Carla at the same time, the
                        - button "path difference" [ref=e1292] [cursor=pointer]
                        - text: "from the two sources to Bob must be an integer number of wavelengths:"
                      - button "Δx = |4 - 2| = 2 m = nλ" [ref=e1293]
                      - button "λ = 2/n" [ref=e1294]
                      - paragraph [ref=e1295]: Possible wavelengths are 2 m, 1 m, 2/3 m, and so on.
                      - heading "4 - Allowed driving frequencies and interference type" [level=4] [ref=e1296]:
                        - text: 4 - Allowed driving frequencies and
                        - button "interference" [ref=e1297] [cursor=pointer]
                        - text: type
                      - button "f = v/λ = 3 / (2/n) = 1.5n Hz" [ref=e1298]
                      - paragraph [ref=e1299]:
                        - text: So possible frequencies are 1.5 Hz, 3.0 Hz, 4.5 Hz, and so on. Those choices make the
                        - button "interference" [ref=e1300] [cursor=pointer]
                        - text: at Bob constructive.
                      - heading "5 - Bob's motion" [level=4] [ref=e1301]
                      - paragraph [ref=e1302]: With both An and Carla timed this way, Bob gets a larger oscillation than he would from either one alone because the two arriving disturbances reinforce each other instead of partially canceling.
