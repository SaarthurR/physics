                  - list [ref=e2331]:
                    - listitem [ref=e2332]: A wave is a traveling disturbance that carries energy. For mechanical waves, the medium oscillates instead of traveling with it.
                    - listitem [ref=e2333]: Transverse = medium moves perpendicular to travel (rope). Longitudinal = parallel (sound).
                    - listitem [ref=e2334]: The wave equation y = A sin(2πt/T ± 2πx/λ + φ₀) encodes how a 1-D wave evolves. Minus means right-moving.
                    - listitem [ref=e2335]: Speed v = λf. Speed is medium-dependent. Frequency is source-dependent. Wavelength depends on both.
                    - listitem [ref=e2336]: In 3D, intensity falls as 1/r² and amplitude falls as 1/r. Decibels are logarithmic.
                    - listitem [ref=e2337]:
                      - button "Doppler effect" [ref=e2338] [cursor=pointer]
                      - text: shifts observed frequency by compressing or stretching wavelength.
                    - listitem [ref=e2339]:
                      - button "Superposition" [ref=e2340] [cursor=pointer]
                      - text: means displacements add algebraically. ΔΦ = 2nπ gives constructive and odd multiples of π give destructive.
                    - listitem [ref=e2341]:
                      - text: ΔΦ = -2πΔx/λ + Δφ₀, so both
                      - button "path difference" [ref=e2342] [cursor=pointer]
                      - text: and fixed
                      - button "phase difference" [ref=e2343] [cursor=pointer]
                      - text: matter.
                    - listitem [ref=e2344]: Reversing speaker leads makes Δφ₀ = π. Combined with path offsets, it can flip destructive into constructive.
                    - listitem [ref=e2345]:
                      - text: Beats come from two nearby frequencies. f
                      - subscript [ref=e2346]: beat
                      - text: = |f₁ - f₂| and f
                      - subscript [ref=e2347]: carrier
                      - text: = (f₁ + f₂)/2.
                    - listitem [ref=e2348]:
                      - button "Diffraction" [ref=e2349] [cursor=pointer]
                      - text: means waves spread after passing through a small opening or around an obstacle. Huygens's principle explains why.
                    - listitem [ref=e2350]: Two-slit bright fringes satisfy d sin θ = nλ. Dark fringes satisfy d sin θ = (n + 1/2)λ.
                    - listitem [ref=e2351]:
                      - text: Young's experiment gave decisive evidence for the wave behavior of light because it produced alternating bright and dark
                      - button "interference" [ref=e2352] [cursor=pointer]
                      - text: bands.
                    - listitem [ref=e2353]:
                      - text: More slits sharpen the peaks at the same angles.
