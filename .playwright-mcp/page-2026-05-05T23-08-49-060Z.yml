                      - text: is one brief disturbance. A
                      - strong [ref=e2112]: periodic harmonic wave
                      - text: repeats continuously and gives us the clean sinusoidal model used all over the rest of the chapter.
                    - paragraph [ref=e2113]: "The textbook also formalizes the vocabulary around waves: displacement, equilibrium, amplitude, period, frequency, wavelength, wave speed, and dimensionality."
                    - paragraph [ref=e2114]:
                      - strong [ref=e2115]: Polarization
                      - text: is the special idea this section adds most clearly. Only transverse waves can be polarized, because only transverse waves can choose among different perpendicular directions to oscillate in. A longitudinal wave oscillates only along the direction of travel, so there is nothing to filter into one plane.
