                        - listitem [ref=e1896]:
                          - text: The two reflected rays you drew in a) meet at the top scale and interfere. How large must the distance d be for the two reflections of blue light rays to interfere constructively? Blue light has a wavelength of about 450 nm in air. Assume that the reflected rays do not have a
