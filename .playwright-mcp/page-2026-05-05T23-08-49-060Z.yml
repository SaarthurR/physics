                  - generic [ref=e605]:
                    - heading "Transverse Waves" [level=4] [ref=e606]
                    - paragraph [ref=e607]: The medium moves perpendicular (at 90 degrees) to the direction the wave travels.
                    - paragraph [ref=e608]:
                      - strong [ref=e609]: "Example:"
                      - text: A rope wave. You shake one end up-and-down. The disturbance travels horizontally. The rope moves vertically. Those two directions are perpendicular - that's transverse.
                    - paragraph [ref=e610]:
                      - strong [ref=e611]: "Also:"
                      - text: In the simple surface-wave model used in this class, water waves are treated as transverse because the surface moves up/down while the disturbance moves outward.
                    - figure "DL1 includes a transverse-wave rope example, which pairs well with this section's discussion of perpendicular motion." [ref=e612]:
                      - img "Transverse wave displacement graph from DL1" [ref=e613]
                      - generic [ref=e614]: DL1 includes a transverse-wave rope example, which pairs well with this section's discussion of perpendicular motion.
                    - heading "Longitudinal Waves" [level=4] [ref=e615]
                    - paragraph [ref=e616]: The medium moves parallel to (in the same direction as) the wave travel.
                    - paragraph [ref=e617]:
                      - strong [ref=e618]: "Example:"
                      - text: Sound. Air molecules are squeezed together (compressions) and spread apart (rarefactions) in the same direction the sound is moving. Push a slinky from one end - the coils compress and expand along the slinky's length.
                    - generic [ref=e619]:
                      - strong [ref=e620]: "Common Confusion:"
                      - text: People think "longitudinal" means the medium travels with the wave. It doesn't. Air molecules in a sound wave oscillate back and forth around a fixed point - they don't travel from the speaker to your ear. Only the disturbance travels.
                - article [ref=e621]:
