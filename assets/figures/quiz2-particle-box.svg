<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" fill="none">
  <defs>
    <linearGradient id="bg" x1="80" y1="50" x2="900" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDF8F0" />
      <stop offset="1" stop-color="#EDF4F8" />
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="940" height="440" rx="34" fill="url(#bg)" />
  <rect x="20" y="20" width="940" height="440" rx="34" stroke="#D8E2E8" />

  <text x="490" y="72" text-anchor="middle" fill="#3B5A99" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="2">PARTICLE IN A BOX</text>

  <g transform="translate(88 120)">
    <rect x="0" y="0" width="372" height="240" rx="28" fill="#FFFFFF" fill-opacity="0.88" stroke="#D8E2E8" />
    <text x="186" y="36" text-anchor="middle" fill="#24323A" font-family="Fraunces, Georgia, serif" font-size="28" font-weight="600">Allowed standing waves</text>
    <line x1="64" y1="160" x2="308" y2="160" stroke="#D7E2EA" stroke-width="4" />
    <line x1="64" y1="88" x2="64" y2="232" stroke="#24323A" stroke-width="8" stroke-linecap="round" />
    <line x1="308" y1="88" x2="308" y2="232" stroke="#24323A" stroke-width="8" stroke-linecap="round" />
    <path d="M64 160 C106 104 144 104 186 160 C228 216 266 216 308 160" stroke="#5F81C3" stroke-width="8" stroke-linecap="round" />
    <circle cx="64" cy="160" r="9" fill="#3B5A99" />
    <circle cx="186" cy="160" r="9" fill="#3B5A99" />
    <circle cx="308" cy="160" r="9" fill="#3B5A99" />
    <text x="186" y="204" text-anchor="middle" fill="#5B6B72" font-family="Manrope, Arial, sans-serif" font-size="16">the walls are nodes</text>
  </g>

  <g transform="translate(512 120)">
    <rect x="0" y="0" width="380" height="240" rx="28" fill="#FFFFFF" fill-opacity="0.88" stroke="#D8E2E8" />
    <text x="190" y="38" text-anchor="middle" fill="#24323A" font-family="Fraunces, Georgia, serif" font-size="28" font-weight="600">Why the energy is quantized</text>
    <text x="44" y="96" fill="#5B6B72" font-family="Manrope, Arial, sans-serif" font-size="17">1. Only whole standing-wave fits are allowed.</text>
    <text x="44" y="132" fill="#5B6B72" font-family="Manrope, Arial, sans-serif" font-size="17">2. That means only certain wavelengths fit inside L.</text>
    <text x="44" y="168" fill="#5B6B72" font-family="Manrope, Arial, sans-serif" font-size="17">3. Shorter λ means bigger momentum, so higher energy.</text>
    <text x="44" y="210" fill="#3B5A99" font-family="Fraunces, Georgia, serif" font-size="26" font-weight="600">λ = h / p</text>
  </g>

  <rect x="240" y="386" width="500" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.8" />
  <text x="490" y="408" text-anchor="middle" fill="#5B6B72" font-family="Manrope, Arial, sans-serif" font-size="16">No fit, no state: the boundary condition creates the allowed energies.</text>
</svg>
