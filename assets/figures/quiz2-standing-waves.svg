<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" fill="none">
  <defs>
    <linearGradient id="bg" x1="80" y1="60" x2="1020" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCF7EF" />
      <stop offset="1" stop-color="#EEF4F6" />
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="1060" height="520" rx="34" fill="url(#bg)" />
  <rect x="20" y="20" width="1060" height="520" rx="34" stroke="#D8E2E8" />

  <text x="550" y="74" text-anchor="middle" fill="#3B5A99" font-family="Manrope, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="2">STANDING WAVE BOUNDARY PATTERNS</text>

  <g transform="translate(66 120)">
    <rect x="0" y="0" width="304" height="320" rx="28" fill="#FFFFFF" fill-opacity="0.88" stroke="#D8E2E8" />
    <text x="152" y="36" text-anchor="middle" fill="#24323A" font-family="Fraunces, Georgia, serif" font-size="28" font-weight="600">Fixed-Fixed</text>
    <text x="152" y="66" text-anchor="middle" fill="#5B6B72" font-family="Manrope, Arial, sans-serif" font-size="16">nodes at both ends</text>
    <line x1="42" y1="170" x2="262" y2="170" stroke="#D7E2EA" stroke-width="4" />
    <path d="M42 170 C78 92 120 92 152 170 C184 248 226 248 262 170" stroke="#5F81C3" stroke-width="8" stroke-linecap="round" />
    <circle cx="42" cy="170" r="10" fill="#3B5A99" />
    <circle cx="152" cy="170" r="10" fill="#3B5A99" />
    <circle cx="262" cy="170" r="10" fill="#3B5A99" />
    <circle cx="97" cy="114" r="10" fill="#D9B24C" />
    <circle cx="207" cy="226" r="10" fill="#D9B24C" />
    <text x="152" y="272" text-anchor="middle" fill="#5B6B72" font-family="Manrope, Arial, sans-serif" font-size="16">fundamental: λ = 2L</text>
    <text x="152" y="298" text-anchor="middle" fill="#5B6B72" font-family="Manrope, Arial, sans-serif" font-size="16">general: λₙ = 2L / n</text>
  </g>

  <g transform="translate(398 120)">
    <rect x="0" y="0" width="304" height="320" rx="28" fill="#FFFFFF" fill-opacity="0.88" stroke="#D8E2E8" />
    <text x="152" y="36" text-anchor="middle" fill="#24323A" font-family="Fraunces, Georgia, serif" font-size="28" font-weight="600">Open-Open</text>
    <text x="152" y="66" text-anchor="middle" fill="#5B6B72" font-family="Manrope, Arial, sans-serif" font-size="16">antinodes at both ends</text>
    <line x1="42" y1="170" x2="262" y2="170" stroke="#D7E2EA" stroke-width="4" />
    <path d="M42 170 C42 84 96 84 152 170 C208 256 262 256 262 170" stroke="#5F81C3" stroke-width="8" stroke-linecap="round" />
    <circle cx="97" cy="170" r="10" fill="#3B5A99" />
    <circle cx="207" cy="170" r="10" fill="#3B5A99" />
    <circle cx="42" cy="170" r="10" fill="#D9B24C" />
    <circle cx="152" cy="170" r="10" fill="#D9B24C" />
    <circle cx="262" cy="170" r="10" fill="#D9B24C" />
    <text x="152" y="272" text-anchor="middle" fill="#5B6B72" font-family="Manrope, Arial, sans-serif" font-size="16">same harmonic rule as fixed-fixed</text>
    <text x="152" y="298" text-anchor="middle" fill="#5B6B72" font-family="Manrope, Arial, sans-serif" font-size="16">but the ends are antinodes</text>
  </g>

  <g transform="translate(730 120)">
    <rect x="0" y="0" width="304" height="320" rx="28" fill="#FFFFFF" fill-opacity="0.88" stroke="#D8E2E8" />
    <text x="152" y="36" text-anchor="middle" fill="#24323A" font-family="Fraunces, Georgia, serif" font-size="28" font-weight="600">Fixed-Open</text>
    <text x="152" y="66" text-anchor="middle" fill="#5B6B72" font-family="Manrope, Arial, sans-serif" font-size="16">node at one end, antinode at the other</text>
    <line x1="42" y1="170" x2="262" y2="170" stroke="#D7E2EA" stroke-width="4" />
    <path d="M42 170 C84 170 120 74 152 74 C184 74 220 170 262 170" stroke="#5F81C3" stroke-width="8" stroke-linecap="round" />
    <circle cx="42" cy="170" r="10" fill="#3B5A99" />
    <circle cx="152" cy="74" r="10" fill="#D9B24C" />
    <circle cx="262" cy="170" r="10" fill="#D9B24C" />
    <text x="152" y="272" text-anchor="middle" fill="#5B6B72" font-family="Manrope, Arial, sans-serif" font-size="16">fundamental: λ = 4L</text>
    <text x="152" y="298" text-anchor="middle" fill="#5B6B72" font-family="Manrope, Arial, sans-serif" font-size="16">general: λₙ = 4L / (2n - 1)</text>
  </g>

  <rect x="350" y="470" width="400" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.76" />
  <text x="550" y="490" text-anchor="middle" fill="#5B6B72" font-family="Manrope, Arial, sans-serif" font-size="15">blue = standing-wave shape, navy = node, gold = antinode</text>
</svg>
